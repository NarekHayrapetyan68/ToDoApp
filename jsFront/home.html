<header class="title">
    <h1>TO DO APP</h1>
</header>

<main class="wrapper">
    <form class="form-container">
        <input id='todo_input' type="text" placeholder="What needs to be done?" autocomplete="off">
        <select name="type" id="types">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>

        </select>

        <input type="date" id="task-date" name="task-date" placeholder="Date">
        <button id="add_button">ADD</button>
    </form>
    <form class="filter-container">
        <span><img src="adjust_10016969.png" height="40px" , width="40px"></i> </span>

        <!--            <span class="radio-text">All</span>-->
        <input type="radio" id="all-filter" name="filter-status" value="all" checked>
        <label for="all-filter" class="filter-custom-radio"><i class="fa-solid fa-list"></i></label>
        <!--            <span class="radio-text">Completed</span>-->
        <input type="radio" id="pending-filter" name="filter-status" value="pending">
        <label for="pending-filter" class="filter-custom-radio"><i class="fa-regular fa-hourglass-half"></i></label>

        <!--            <span class="radio-text">Pending</span>-->

        <input type="radio" id="completed-filter" name="filter-status" value="completed">
        <label for="completed-filter" class="filter-custom-radio"><i class="fa-solid fa-check-double"></i></label>


    </form>

</main>
